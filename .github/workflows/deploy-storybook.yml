name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages requires these permissions on the workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time. Don't cancel an in-flight deploy when a new
# commit lands — let the prior one finish so the URL is never broken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # TODO: re-enable once typescript-eslint is configured. ESLint v9 needs a
      # flat config with a TS parser; none is set up yet.
      # - run: npm run lint
      - run: npm run test -- --run
      - run: npm run storybook:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
