name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # TODO: re-enable once typescript-eslint is configured. ESLint v9 needs a
      # flat config with a TS parser; none is set up yet.
      # - run: npm run lint
      - run: npm run test -- --run
      - run: npm run storybook:build
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 30

      # TODO: add deploy step once the client-controlled host is confirmed
      # (likely SSH/SFTP, S3 sync, or a provider-specific action). Only the
      # latest build on main is published — no per-tag URLs, no PR previews.
